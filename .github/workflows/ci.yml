name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Compute node modules cache key
        id: nodeModulesCacheKey
        run: echo "value=$(node packages/build/src/computeNodeModulesCacheKey.ts)" >> $GITHUB_OUTPUT
        shell: bash
      - uses: actions/cache@v6
        id: npm-cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-${{ runner.arch }}-cacheNodeModules-${{ steps.nodeModulesCacheKey.outputs.value }}
      - name: npm ci
        run: npm ci
        if: steps.npm-cache.outputs.cache-hit != 'true'
      - run: npm run build
      - run: npm test
      - run: npm run type-check
      - run: npm run lint
      - name: Install Playwright system dependencies
        if: matrix.os == 'ubuntu-24.04'
        working-directory: packages/e2e
        run: sudo npx playwright install-deps chromium
      - name: Install Chromium
        if: matrix.os == 'ubuntu-24.04' && steps.npm-cache.outputs.cache-hit != 'true'
        working-directory: packages/e2e
        run: npx playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: e2e
        if: matrix.os == 'ubuntu-24.04'
        working-directory: packages/e2e
        run: npm run e2e:headless
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Upload build artifacts
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v7
        with:
          name: worker-bundles
          path: ./.tmp/dist
      - name: Upload GitHub Pages artifact
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./.tmp/dist

  deploy:
    needs: ci
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
